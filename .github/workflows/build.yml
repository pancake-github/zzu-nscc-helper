# 仅在隔离GitHub Windows机器构建，不读取使用者电脑或平台凭据。
name: Windows candidate build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
          architecture: x64
      - name: Install isolated build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r packaging/requirements-build.lock
      - name: Audit all exported sources and Git history
        shell: pwsh
        run: python -B scripts/audit_public_tree.py
      - name: Run offline regression
        shell: pwsh
        run: |
          python -B scripts/build_release.py --native-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s tests -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/test_extension_fusion.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install verified Inno Setup in disposable runner
        shell: pwsh
        run: |
          $settings = Get-Content packaging/build-settings.json -Raw | ConvertFrom-Json
          $tool = Join-Path $env:RUNNER_TEMP 'innosetup-6.5.4.exe'
          Invoke-WebRequest -Uri $settings.inno_url -OutFile $tool
          if ((Get-FileHash -LiteralPath $tool -Algorithm SHA256).Hash.ToLowerInvariant() -ne $settings.inno_sha256) { throw 'INNO_HASH_MISMATCH' }
          $toolDirectory = Join-Path $env:RUNNER_TEMP 'zzu-inno'
          $installation = Start-Process -FilePath $tool -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="' + $toolDirectory + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($installation.ExitCode -ne 0) { throw 'INNO_INSTALL_FAILED' }
          $language = Join-Path $toolDirectory 'Languages/ChineseSimplified.isl'
          if (-not (Test-Path -LiteralPath $language)) { Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/jrsoftware/issrc/is-6_5_4/Files/Languages/Unofficial/ChineseSimplified.isl' -OutFile $language }
          ('ZZU_ISCC=' + (Join-Path $toolDirectory 'ISCC.exe')) >> $env:GITHUB_ENV
      - name: Build runtime, components and installers
        shell: pwsh
        run: python -B scripts/build_release.py --iscc "$env:ZZU_ISCC"
      - name: Audit packaged assets
        shell: pwsh
        run: python -B scripts/audit_release.py dist/release
      - name: Validate all component combinations with exact installers
        shell: pwsh
        run: python -B scripts/test_installers.py dist/release
      - name: Upload candidate artifacts without publishing a Release
        uses: actions/upload-artifact@v4
        with:
          name: windows-candidate-${{ github.sha }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
